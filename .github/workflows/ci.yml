# Checks every PR and every push to development and main. No secrets: fake model clients and replay only.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ur_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ur_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Integration tests (real PostgreSQL, fake model clients)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ur_ci_test
          APP_DEPLOYMENT: local
          AGENT_REPLAY: "1"
          DEMO_NOW: 2026-11-03T09:00:00-05:00
        run: |
          npm run db:migrate
          npm run test:integration
